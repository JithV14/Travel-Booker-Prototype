<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password – TravelBooker</title>

<link rel="stylesheet" href="Global.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

<style>

/* REMOVE DEFAULT WHITE SPACE */
body {
    margin: 0;
    padding: 0;
    background: var(--navy);
}

/* PAGE BACKGROUND */
.login-page {
    min-height: 100vh; /* FIXED */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem 2rem;
    margin-top: 30px; /* GAP UNDER NAVBAR */
    background: var(--navy);
    position: relative;
    overflow: hidden;
}

.login-page::before {
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 30% 50%,rgba(29,196,152,0.12) 0%,transparent 65%);
}

/* CONTAINER */
.login-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 860px;
    width: 100%;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

@media(max-width:640px){
    .login-container { grid-template-columns: 1fr; }
    .login-left { display: none; }
}

/* LEFT PANEL */
.login-left {
    background: linear-gradient(160deg, #1a4030 0%, #1e3a5f 100%);
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.login-left h2 { color: white; margin-bottom: 1rem; }
.login-left p { font-size: 14px; color: rgba(255,255,255,.7); }

/* RIGHT PANEL */
.login-right {
    background: white;
    padding: 3rem 2.5rem;
}
.login-right h1 {
    color: var(--navy);
    margin-bottom: .4rem;
}
.login-sub {
    font-size: 13px;
    color: var(--text-mid);
    margin-bottom: 2rem;
}

/* FORM */
.form-group { margin-bottom: 1rem; }

.form-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    display:block;
    margin-bottom:.3rem;
}

.input-wrap { position: relative; }

.input-wrap i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
}

.form-input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--light-bg);
}

.form-input:focus {
    border-color: var(--teal);
    background: white;
    outline: none;
}

/* BUTTONS */
.reset-btn {
    width: 100%;
    padding: 13px;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-weight: 600;
    cursor: pointer;
    margin-top: .5rem;
}

.reset-btn:hover { background: var(--teal); }

.login-btn-alt {
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--navy);
    border: 1.5px solid var(--navy);
    border-radius: var(--radius-md);
    font-weight: 600;
    cursor: pointer;
    margin-top: .7rem;
}

.login-btn-alt:hover {
    background: var(--navy);
    color: white;
}

/* BACK LINK */
.back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-mid);
    text-decoration: none;
    margin-bottom: 1.5rem;
}

.back-link:hover { color: var(--teal); }

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-top">
    <a class="logo" href="index.html">
      <img src="Travel Booker logo design.png" class="logo-imgg"/>
      <span>TravelBooker</span>
    </a>

    <div class="nav-right">
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about_us.html">About Us</a></li>
        <li><a href="contact_us.html">Contact Us</a></li>
        <li><a href="login.html" class="sign-button">Login</a></li>
        <li><a href="signup.html" class="sign-button">Sign in</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- PAGE -->
<div class="login-page">
  <div class="login-container">

    <!-- LEFT -->
    <div class="login-left">
      <h2>Create a New Password 🔑</h2>
      <p>Enter your email and set a new secure password to continue your journey with TravelBooker.</p>
    </div>

    <!-- RIGHT -->
    <div class="login-right">

      <a href="login.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Login
      </a>

      <h1>Reset Password</h1>
      <p class="login-sub">Fill in the details below</p>

      <form>

        <!-- EMAIL -->
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" class="form-input" placeholder="you@email.com" required>
          </div>
        </div>

        <!-- NEW PASSWORD -->
        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-input" placeholder="Enter new password" required>
          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label>Re-enter Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-input" placeholder="Confirm password" required>
          </div>
        </div>

        <button type="submit" class="reset-btn">Reset Password</button>
        <button type="button" onclick="window.location.href='login.html'" class="login-btn-alt">Back to Login</button>

      </form>

    </div>

  </div>
</div>

</body>
</html>
