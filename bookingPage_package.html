<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f9f4;
      --card: #ffffff;
      --border: #b8d96e;
      --accent: #f26522;
      --accent-hover: #d9541a;
      --text: #1a1a1a;
      --muted: #888;
      --input-bg: #f0f4ea;
      --input-border: #d4e6a0;
      --link: #2563eb;
      --shadow: 0 8px 40px rgba(100,140,30,0.10);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 60px;
      color: var(--text);
    }

    /* Subtle background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 70% 20%, rgba(184,217,110,0.13) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(242,101,34,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--link);
      font-size: 0.93rem;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 24px;
      transition: gap 0.2s;
      letter-spacing: 0.01em;
    }
    .back-link:hover { gap: 10px; color: #1a40b0; }
    .back-link svg { width: 16px; height: 16px; }

    .card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 18px;
      padding: 40px 44px 44px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.55s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 34px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .section-divider {
      border: none;
      border-top: 1.5px dashed var(--border);
      margin: 26px 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 7px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    label .sub {
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      margin-left: 5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 9px;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.97rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      appearance: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--border);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(184,217,110,0.22);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .date-row .date-sep {
      display: none;
    }

    .select-wrap {
      position: relative;
    }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .select-wrap select {
      padding-right: 34px;
      cursor: pointer;
    }

    .period-link {
      color: var(--link);
      font-size: 0.83rem;
      font-weight: 500;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 8px;
      transition: color 0.15s;
    }
    .period-link:hover { color: #1a40b0; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .name-passport-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .add-btn {
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      color: #5a8a00;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 14px;
      margin-top: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.02em;
    }
    .add-btn:hover { background: #f0f9d6; border-color: #8ab800; }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 32px;
    }

    .btn-book {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 32px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 18px rgba(242,101,34,0.25);
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-book:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(242,101,34,0.32);
    }
    .btn-book:active { transform: translateY(0); }
    .btn-book svg { width: 18px; height: 18px; }

    @media (max-width: 540px) {
      .card { padding: 26px 18px 30px; }
      .date-row, .row-2, .name-passport-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  

  <div class="card">
    <h1 class="card-title">Booking Details</h1>

    <!-- Package Code -->
    <div class="form-group">
      <label>Package Code</label>
      <input type="text" placeholder="Enter package code" />
    </div>

    <!-- Tour Period -->
    <div class="form-group">
      <span class="period-link">Select Package Tour Period</span>
      <div class="date-row">
        <div>
          <label style="text-transform:none; font-size:0.78rem; color:var(--muted); margin-bottom:4px;">From</label>
          <input type="date" />
        </div>
        <div>
          <label style="text-transform:none; font-size:0.78rem; color:var(--muted); margin-bottom:4px;">To</label>
          <input type="date" />
        </div>
      </div>
    </div>

    <hr class="section-divider" />

    <!-- Adults & Kids -->
    <div class="row-2">
      <div class="form-group">
        <label>Number of Adults</label>
        <div class="select-wrap">
          <select>
            <option value="1">Min: 1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6+</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Number of Kids <span class="sub">Age under 12</span></label>
        <div class="select-wrap">
          <select>
            <option value="0">--</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4+</option>
          </select>
        </div>
      </div>
    </div>

    <hr class="section-divider" />

    <!-- Full Name(s) -->
    <div class="form-group">
      <label>Full Name(s)</label>
      <input type="text" placeholder="Enter full name(s)" />
      <button class="add-btn" type="button">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6.5" y1="1" x2="6.5" y2="12"/><line x1="1" y1="6.5" x2="12" y2="6.5"/>
        </svg>
        Add Traveller
      </button>
    </div>

    <!-- Passport Details -->
    <div class="form-group">
      <label>Passport Details</label>
      <input type="text" placeholder="Passport number / details" />
    </div>

    <!-- Email & Phone -->
    <div class="name-passport-row">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="+1 000 000 0000" />
      </div>
    </div>

    <!-- Special Notes -->
    <div class="form-group">
      <label>Special Notes</label>
      <textarea placeholder="Any special requests or notes..."></textarea>
    </div>

    <!-- Submit -->
    <div class="submit-row">
  <a href="payment.html" class="btn-book">
    Book &amp; Proceed to Pay
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2">
      <polyline points="6 4 12 9 6 14"/>
    </svg>
  </a>
</div>

  </div>
</div>
</body>
</html>
